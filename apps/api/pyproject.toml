[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candy-map-api"
version = "0.1.0"
description = "FastAPI backend for the Sweetpath candy house map."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.2",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "anyio>=4.6.2"
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["app/tests"]


